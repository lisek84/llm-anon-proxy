# Your private values. Everything here is replaced deterministically before
# anything leaves the machine, and restored on the way back.
#
# Matching is case-insensitive and substring-based, longest first, so listing a
# registrable domain also covers its subdomains:
#   example.com  ->  cdn3.example.com is handled as cdn3.<surrogate>
#
# Keep this file private (chmod 600). It is git-ignored by default.

domains:
  - example-prod.pl

hosts:
  - of-prod-db01

ips:
  - 185.12.34.56

emails:
  - admin@example-prod.pl

usernames:
  - of_app

organizations:
  - example

# Bare brand/project words caught wherever they appear as a component —
# /var/www/example, sites-enabled/example.conf, example-worker. A full domain
# like example.com is still handled as a domain (the longer match wins first).
keywords:
  - example

paths:
  - /home/lisek/example-ops
