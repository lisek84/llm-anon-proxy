# Turnkey Docker deployment.
#
#   git clone … /llm-anon-proxy && cd /llm-anon-proxy
#   cp dictionary.example.yaml dictionary.yaml   # then edit with YOUR values
#   docker compose up -d                         # proxy only (dictionary + regex)
#
# With the local LLM layer (pulls the model; uses an NVIDIA GPU by default, which
# needs the NVIDIA Container Toolkit):
#   ANONPROXY_LLM=true docker compose --profile llm up -d
# No GPU? add the CPU override:
#   ANONPROXY_LLM=true docker compose -f docker-compose.yml -f docker-compose.cpu.yml --profile llm up -d
#
# Then in your working console:
#   ./claude_anon            # or: export ANTHROPIC_BASE_URL=http://127.0.0.1:8787 && claude
#
# All state (vault, secret key, rotation + audit logs) is written to ./data next
# to this file. Inspect it with:
#   docker compose exec proxy python -m anonproxy.rotate
#   docker compose exec proxy python -m anonproxy.audit

services:
  proxy:
    build: .
    image: llm-anon-proxy
    container_name: anonproxy
    ports:
      - "127.0.0.1:8787:8787"        # loopback only on the host
    # Run as a DEDICATED non-root, non-login UID (default 991) — deliberately NOT
    # the host user that runs Claude Code. The vault in ./data is 0700, so a
    # separate owner is what actually keeps the agent's user from reading
    # mappings.db / secret.key and reversing the anonymization. Create ./data
    # owned by this UID first (see INSTALL). Do NOT set this to $(id -u): that
    # re-grants your Claude Code user access to the vault and defeats isolation.
    user: "${ANONPROXY_UID:-991}:${ANONPROXY_GID:-991}"
    cap_drop: [ALL]                   # the proxy needs no Linux capabilities
    security_opt:
      - no-new-privileges:true        # block setuid privilege escalation
    environment:
      ANONPROXY_LLM: ${ANONPROXY_LLM:-false}
      ANONPROXY_OLLAMA_HOST: http://ollama:11434
      ANONPROXY_OLLAMA_MODEL: ${ANONPROXY_OLLAMA_MODEL:-qwen3.5:4b}
      ANONPROXY_UI_SHOW_ORIGINALS: ${ANONPROXY_UI_SHOW_ORIGINALS:-false}
      ANONPROXY_ISOLATION: ${ANONPROXY_ISOLATION:-warn}
      ANONPROXY_CONTEXT: ${ANONPROXY_CONTEXT:-default}
      # For ISOLATION=enforce inside a container the host username can't be
      # resolved — pass the agent user's numeric id instead:
      #   ANONPROXY_CLIENT_UID=$(id -u) ANONPROXY_CLIENT_GIDS="$(id -G|tr ' ' ,)" docker compose up -d
      ANONPROXY_CLIENT_UID: ${ANONPROXY_CLIENT_UID:-}
      ANONPROXY_CLIENT_GIDS: ${ANONPROXY_CLIENT_GIDS:-}
    volumes:
      - ./data:/app/data                       # persists to the compose directory
      - ./dictionary.yaml:/app/dictionary.yaml:ro
    restart: unless-stopped

  # Local LLM layer — only started with:  --profile llm
  ollama:
    image: ollama/ollama:latest
    container_name: anonproxy-ollama
    profiles: ["llm"]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # Defaults to an NVIDIA GPU (needs the NVIDIA Container Toolkit) — the usual
    # case when you run a local LLM. No GPU? add the CPU override, which clears
    # this reservation:
    #   docker compose -f docker-compose.yml -f docker-compose.cpu.yml --profile llm up -d
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # One-shot: wait for Ollama, pull the detector model, exit. Only with --profile llm.
  model-pull:
    image: ollama/ollama:latest
    profiles: ["llm"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
      ANONPROXY_OLLAMA_MODEL: ${ANONPROXY_OLLAMA_MODEL:-qwen3.5:4b}
    entrypoint: ["/bin/sh", "-c", "sleep 3; ollama pull \"$${ANONPROXY_OLLAMA_MODEL}\""]
    restart: "no"

volumes:
  ollama_models:
